<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー検索</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">

    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">

        <h1 class="text-2xl font-bold mb-6">
            GitHubユーザー検索
        </h1>

        <!-- ユーザー名入力 -->
        <div class="flex gap-2 mb-6">
            <input
                id="usernameInput"
                type="text"
                placeholder="GitHubユーザー名"
                class="flex-1 border border-gray-300 rounded px-3 py-2"
            >

            <button
                id="searchButton"
                class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
            >
                検索
            </button>
        </div>

        <!-- ユーザー情報を表示する場所 -->
        <div id="userInfo"></div>

    </div>


    <script>

        const usernameInput = document.getElementById("usernameInput");
        const searchButton = document.getElementById("searchButton");
        const userInfo = document.getElementById("userInfo");


        searchButton.addEventListener("click", async () => {

            const username = usernameInput.value.trim();

            // 入力されていない場合
            if (username === "") {
                userInfo.textContent = "ユーザー名を入力してください";
                return;
            }

            try {

                // GitHub APIからデータを取得
                const response = await fetch(
                    `https://api.github.com/users/${username}`
                );

                // ユーザーが存在しない場合
                if (!response.ok) {
                    userInfo.textContent = "ユーザーが見つかりませんでした";
                    return;
                }

                // JSONデータに変換
                const user = await response.json();

                // Consoleで取得したデータを確認
                console.log(user);

                // 画面を一度空にする
                userInfo.textContent = "";

                // カードを作る
                const card = document.createElement("div");
                card.className = "text-center";

                // アバター画像
                const avatar = document.createElement("img");
                avatar.src = user.avatar_url;
                avatar.alt = user.name || username;
                avatar.className = "w-32 h-32 rounded-full mx-auto mb-4";

                // 名前
                const name = document.createElement("h2");
                name.textContent = user.name || username;
                name.className = "text-xl font-bold mb-2";

                // bio
                const bio = document.createElement("p");
                bio.textContent = user.bio || "自己紹介はありません";
                bio.className = "text-gray-600 mb-2";

                // フォロワー数
                const followers = document.createElement("p");
                followers.textContent = `フォロワー：${user.followers}人`;
                followers.className = "text-gray-700";

                // カードに追加
                card.appendChild(avatar);
                card.appendChild(name);
                card.appendChild(bio);
                card.appendChild(followers);

                // 画面に追加
                userInfo.appendChild(card);

            } catch (error) {

                // 通信そのものに失敗した場合
                userInfo.textContent = "データの取得に失敗しました";
                console.error(error);

            }

        });

    </script>

</body>
</html>
