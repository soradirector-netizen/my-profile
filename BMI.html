<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI計算ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#e0ffff] flex items-center justify-center p-4">
    
    <div class="bg-[#afeeee] rounded-lg shadow p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold mb-6">BMI計算ツール</h1>

        <div class="mb-4">
            <label class="block text-lg font-normal text-[#000000] mb-1">身長（cm）</label>
            <input id="height" type="number" placeholder="例：170"
            class="w-full border border-[#00ffff] rounded px-3 py-2">
        </div>

        <div class="mb-6">
            <label class="block text-lg font-normal text-[#000000] mb-1">体重(kg)</label>
            <input id="weight" type="number" placeholder="例：65"
            class="w-full border border-[#00ffff] rounded px-3 py-2">
        </div>

        <button id="calcBtn"
        class="w-full bg-[#00bfff] text-[#ffffff] font-bold py-2 rounded hover:bg-[#4169e1] transition">
        計算する
        </button>

        <p id="result" class="mt-6 text-center text-lg font-bold text-[#191970]"></p>
        </div>

        <script>
        function calcBmi(height,weight){
        const heightM=height / 100;
        return weight / (heightM * heightM);
        }

        function getJudgment(bmi){
            if (bmi < 18.5) {
                return "痩せ型";
            } else if (bmi < 25){
                return "普通";
            } else {
                return "肥満";
            }
        }

    const button = document.querySelector("#calcBtn");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
        const height = Number(document.querySelector("#height").value);
        const weight = Number(document.querySelector("#weight").value);

        if (height <= 0 || weight <= 0) {
            result.textContent = "入力内容を確認してください。『半角数字』で身長と体重の入力が必要です。";
            result.style.color = "#dc143c";
            result.style.fontWeight = "normal";
            return;
        }

        const bmi = calcBmi(height , weight);
        const judgment = getJudgment(bmi);

        result.style.color = "#191970";
        result.style.fontWeight = "bold";
        
        result.textContent = "BMI: " + bmi.toFixed(1) + " (" + judgment + ") ";
        });
    </script>


</body>
</html>
